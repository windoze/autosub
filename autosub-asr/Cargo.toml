[package]
name = "autosub-asr"
version = "0.1.0"
edition = "2021"
description = "ASR engine for automatic speech recognition using Whisper"
license = "MIT"

[dependencies]
# Candle for Whisper transcription
candle-core = "0.9.2-alpha.1"
candle-nn = "0.9.2-alpha.1"
candle-transformers = "0.9.2-alpha.1"
hf-hub = "0.4"
tokenizers = "0.22"

# Async runtime & channels
tokio = { version = "1", features = ["sync", "rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

# Audio processing
byteorder = "1.5"

# Voice Activity Detection
webrtc-vad = "0.4"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

# Auto-enable metal on macOS when no explicit feature is selected
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.2-alpha.1", features = ["metal"] }
candle-nn = { version = "0.9.2-alpha.1", features = ["metal"] }
candle-transformers = { version = "0.9.2-alpha.1", features = ["metal"] }

[dev-dependencies]
hound = "3.5"
tracing-subscriber = "0.3"
indicatif = "0.18"
