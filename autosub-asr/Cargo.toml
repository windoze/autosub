[package]
name = "autosub-asr"
version = "0.1.0"
edition = "2021"
description = "ASR engine for automatic speech recognition using Whisper"
license = "MIT"

[dependencies]
# ONNX Runtime for Whisper transcription
ort = "2.0.0-rc.11"
ndarray = "0.16"

# Model downloads and tokenization
hf-hub = "0.4"
tokenizers = "0.22"

# Async runtime & channels
tokio = { version = "1", features = ["sync", "rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

# Audio processing
byteorder = "1.5"
rustfft = "6.2"

# Voice Activity Detection
webrtc-vad = "0.4"

[features]
default = ["cuda", "coreml"]
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]

[dev-dependencies]
hound = "3.5"
tracing-subscriber = "0.3"
indicatif = "0.18"
