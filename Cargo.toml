[workspace]
members = ["autosub-asr", "autosub-audio"]

[package]
name = "autosub"
version = "0.1.0"
edition = "2021"
description = "CLI tool for video transcription and subtitle generation using Whisper"
license = "MIT"

[dependencies]
# ASR engine
autosub-asr = { path = "autosub-asr" }

# Audio extraction and streaming
autosub-audio = { path = "autosub-audio" }

# Candle for device selection (still needed in CLI for config)
candle-core = "0.9.2-alpha.1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime & HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# LLM integration (multi-provider support)
llm = { version = "1.3", features = ["openai", "anthropic", "ollama", "google", "deepseek"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress indication
indicatif = "0.18"

# Directories for cache
dirs = "6"

[features]
default = []
cuda = ["autosub-asr/cuda", "candle-core/cuda"]

# FFmpeg static linking - embeds FFmpeg libraries into the binary
# This increases binary size but removes the need for system FFmpeg installation
ffmpeg-static = ["autosub-audio/ffmpeg-static"]

# FFmpeg build from source - builds FFmpeg from source code during compilation
# This provides maximum control but significantly increases compile time
ffmpeg-build = ["autosub-audio/ffmpeg-build"]

# Auto-enable metal on macOS when no explicit feature is selected
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.2-alpha.1", features = ["metal"] }
candle-nn = { version = "0.9.2-alpha.1", features = ["metal"] }
candle-transformers = { version = "0.9.2-alpha.1", features = ["metal"] }
